name: default_brick
description: A new brick created with the Mason CLI.

# The following defines the brick repository url.
# Uncomment and update the following line before publishing the brick.
# repository: https://github.com/my_org/my_repo

# The following defines the version and build number for your brick.
# A version number is three numbers separated by dots, like 1.2.34
# followed by an optional build number (separated by a +).
version: 0.1.0+1

# The following defines the environment for the current brick.
# It includes the version of mason that the brick requires.
environment:
  mason: ^0.1.1

# Variables specify dynamic values that your brick depends on.
# Zero or more variables can be specified for a given brick.
# Each variable has:
#  * a type (string, number, boolean, enum, array, or list)
#  * an optional short description
#  * an optional default value
#  * an optional list of default values (array only)
#  * an optional prompt phrase used when asking for the variable
#  * a list of values (enums only)
#  * an optional separator (list only)
vars:
  name:
    type: string
    description: Project name
    prompt: What is the project name?
    
  use_remote:
    type: boolean
    description: Include Dio
    default: false
    prompt: Include Dio?
    
  use_firebase:
    type: boolean
    description: Include Firebase
    default: false
    prompt: Include Firebase?
    
  bundle_id:
    type: string
    description: The full reverse-domain bundle ID for the app (e.g. com.acme.mystore). Use only letters, digits, and dots. Avoid hyphens or underscores.
    prompt: What is the app bundle ID? (e.g. com.acme.mystore)
    
  platforms:
    type: array
    description: Target platforms to generate.
    prompt: Which platforms does this project target?
    values:
      - android
      - ios
      - macos
      - web
      - windows
      - linux
    defaults:
      - android
      - ios

  sentry_dsn:
    type: string
    description: Sentry DSN for crash reporting. Leave blank to skip (Add later).
    default: "DSN"
    prompt: What is your Sentry DSN? (leave blank to skip and add later)

  dev_base_url:
    type: string
    description: Base URL for the dev flavor
    default: "https://api.example.com"
    prompt: What is the DEV base URL? Empty to skip.

  prod_base_url:
    type: string
    description: Base URL for the prod flavor
    default: "https://api.example.com"
    prompt: What is the PROD base URL? Empty to skip.
